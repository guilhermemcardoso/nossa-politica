name: ETL

on:
  schedule:
    # Todo dia às 06:00 em Brasília: anos recentes
    - cron: "0 9 * * *"
    # Domingo às 04:00 em Brasília: todos os anos da Câmara e a eleição mais recente do TSE
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      completo:
        description: Reprocessar todos os anos (Câmara) e a eleição mais recente (TSE)
        type: boolean
        default: false

concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: write # publicar a branch `dados`
  actions: write # disparar o workflow de deploy

jobs:
  etl:
    name: etl
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      COMPLETO: ${{ inputs.completo || github.event.schedule == '0 7 * * 0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Baixar a carga anterior (branch dados)
        env:
          REPO: https://github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO" dados > /dev/null; then
            git clone --quiet --depth 1 --branch dados "$REPO" dados
            rm -rf dados/.git
          else
            echo "::notice::Branch dados ainda não existe; fazendo a primeira carga completa."
            mkdir dados
          fi

      # Cada fonte roda mesmo que outra falhe: a que falhou fica com os dados
      # da carga anterior, e o job termina com erro no fim para avisar.
      - name: Câmara dos Deputados
        id: camara
        continue-on-error: true
        run: pnpm etl:camara --dados dados $([ "$COMPLETO" = "true" ] && echo --completo)

      - name: Senado Federal
        id: senado
        continue-on-error: true
        run: pnpm etl:senado --dados dados

      # Emendas e TSE cruzam com os parlamentares da Câmara e do Senado
      - name: Emendas parlamentares (Portal da Transparência)
        id: emendas
        continue-on-error: true
        run: pnpm etl:emendas --dados dados

      - name: Eleições (TSE)
        id: tse
        continue-on-error: true
        run: pnpm etl:tse --dados dados $([ "$COMPLETO" = "true" ] && echo --recente)

      - name: Validar os dados
        run: pnpm etl:validar dados

      - name: Publicar na branch dados
        # Um commit único, sem histórico, sobrescrito a cada carga
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dados
        run: |
          git init --quiet --initial-branch dados
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Carga de $(TZ=America/Sao_Paulo date +%F)"
          git push --force --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dados

      - name: Disparar o deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"

      - name: Avisar se alguma fonte falhou
        if: >-
          steps.camara.outcome == 'failure' || steps.senado.outcome == 'failure' ||
          steps.emendas.outcome == 'failure' || steps.tse.outcome == 'failure'
        run: |
          echo "::error::Fontes com falha (publicadas com os dados da carga anterior):" \
            "câmara=${{ steps.camara.outcome }} senado=${{ steps.senado.outcome }}" \
            "emendas=${{ steps.emendas.outcome }} tse=${{ steps.tse.outcome }}"
          exit 1
