name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes unitários (Vitest)
        run: pnpm test
      - name: Build do Worker (OpenNext)
        run: pnpm build:worker

  preview:
    name: preview
    needs: checks
    # PRs de forks não recebem os secrets da Cloudflare
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/ensure-r2-bucket

      - name: Build do Worker (OpenNext)
        run: pnpm build:worker

      - name: Criar o Worker se ainda não existir
        # `wrangler versions upload` exige um Worker já criado. Só acontece uma vez,
        # antes do primeiro deploy de produção.
        run: |
          if ! pnpm exec wrangler deployments list > /dev/null 2>&1; then
            echo "::warning::Worker ainda não existe; fazendo o primeiro deploy para criá-lo."
            pnpm exec opennextjs-cloudflare deploy
          fi

      - name: Enviar versão de preview
        id: upload
        env:
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare upload --preview-alias "$PREVIEW_ALIAS" 2>&1 | tee upload.log
          url=$(grep -oE 'Version Preview Alias URL: https://[^ ]+' upload.log | awk '{print $NF}' | tail -1)
          if [ -z "$url" ]; then
            url=$(grep -oE 'Version Preview URL: https://[^ ]+' upload.log | awk '{print $NF}' | tail -1)
          fi
          if [ -z "$url" ]; then
            echo "::error::URL de preview não encontrada. Verifique se o subdomínio workers.dev está ativo na conta da Cloudflare."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar a URL no PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview-cloudflare -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview na Cloudflare:** ${process.env.PREVIEW_URL}\n\nCommit: ${sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E contra o preview (Playwright)
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.upload.outputs.url }}
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
