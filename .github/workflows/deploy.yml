name: Deploy

on:
  push:
    branches: [main]
  # Permite disparar o deploy à mão ou por outro workflow (ex.: ETL)
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint, typecheck e testes
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - uses: ./.github/actions/ensure-r2-bucket
      - name: Build e deploy na Cloudflare
        run: pnpm run deploy
